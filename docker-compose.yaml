version: '3.8'

services:
  frontend:
    build: ./Frontend
    container_name: frontend_service
    ports:
      - '5173:5173'
    volumes:
      - ./Frontend:/frontend
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend_nest

  backend_nest:
    build: ./backend_nest
    container_name: backend_nest_service
    restart: always
    ports:
      - '3000:3000'
      - '5555:5555'
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mydb"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "secret"
      JWT_REFRESH_SECRET: "secretSecret"
      MAIL_USER: "murynbokgaziz1@gmail.com"
      MAIL_PASS: "ebdi nnte wwwj ledb"
      GOOGLE_CLIENT_ID: "28541606858-i2nvk2qqia0j3cacg59uir9b48q10c3n.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "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"
      GOOGLE_REDIRECT_URI: "http://localhost:3000/auth/google/callback"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: