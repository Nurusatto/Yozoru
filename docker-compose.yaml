services:
  frontend:
    build: ./Frontend
    container_name: frontend_service
    ports:
      - '5173:5173'
    volumes:
      - ./Frontend:/frontend
      - /frontend/node_modules
    env_file:
      - .env.docker
    depends_on:
      - backend_nest

  backend_nest:
    build: ./backend_nest
    container_name: backend_nest_service
    restart: always
    ports:
      - '3000:3000'
      - '5555:5555'
    env_file:
      - ./backend_nest/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env.docker
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: